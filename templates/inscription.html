{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h1>Gestion des Utilisateurs</h1>
</div>
<div class="page-header" style="margin-bottom:16px;">
    <button class="btn-primary" onclick="openForm()">+ Nouvel Utilisateur</button>
</div>
<table class="table">
    <thead><tr><th>ID</th><th>Nom</th><th>Email</th><th>Rôle</th><th>Actions</th></tr></thead>
    <tbody id="table-body"></tbody>
</table>
<script>
async function loadData() {
    const data = await api.get("/api/utilisateurs");
    document.getElementById("table-body").innerHTML = (data||[]).map(u => `<tr>
        <td>${u.id}</td><td>${u.nom}</td><td>${u.email}</td><td>${u.role}</td>
        <td><button class="btn-sm" onclick="openForm(${u.id})">✏️</button> <button class="btn-sm btn-danger" onclick="del(${u.id})">🗑️</button></td>
    </tr>`).join("");
}
async function openForm(id) {
    let u = {nom: "", email: "", role: "Utilisateur"};
    if (id) {
        const all = await api.get("/api/utilisateurs");
        const found = all.find(x => x.id === id);
        if (found) u = found;
    }
    showModal(id ? "Modifier Utilisateur" : "Nouvel Utilisateur", `
        <div class="form-group"><label>Nom</label><input type="text" id="f-nom" value="${u.nom}"></div>
        <div class="form-group"><label>Email</label><input type="email" id="f-email" value="${u.email}"></div>
        <div class="form-group"><label>Mot de passe ${id ? "(laisser vide pour conserver)" : "(min. 6 car.)"}</label><input type="password" id="f-mot_de_passe" ${id ? "" : "minlength=\"6\" required"}></div>
        <div class="form-group"><label>Rôle</label><select id="f-role"><option value="Utilisateur" ${u.role==="Utilisateur"?"selected":""}>Utilisateur</option><option value="Admin" ${u.role==="Admin"?"selected":""}>Admin</option></select></div>
        <button class="btn-primary" onclick="save(${id||""})">Enregistrer</button>
    `);
}
async function save(id) {
    const body = {
        nom: document.getElementById("f-nom").value.trim(),
        email: document.getElementById("f-email").value.trim(),
        role: document.getElementById("f-role").value,
    };
    if (!body.nom || !body.email) return alert("Nom et email sont requis");
    const pw = document.getElementById("f-mot_de_passe").value;
    if (pw) body.mot_de_passe = pw;
    if (!id && !pw) return alert("Mot de passe requis pour un nouvel utilisateur");
    const res = id ? await api.put(`/api/utilisateurs/${id}`, body) : await api.post("/api/auth/inscription", body);
    if (res) { closeModal(); loadData(); }
}
async function del(id) {
    if (!confirm("Supprimer cet utilisateur ?")) return;
    if (await api.del(`/api/utilisateurs/${id}`)) loadData();
}
loadData();
</script>
{% endblock %}
