{% extends "base.html" %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h1>Connexion</h1>
        <form id="form-connexion">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="mot_de_passe">Mot de passe</label>
                <input type="password" id="mot_de_passe" name="mot_de_passe" required>
            </div>
            <p class="form-error" id="form-error"></p>
            <button type="submit" class="btn-primary">Se connecter</button>
        </form>
        <p class="auth-link">Pas encore de compte ? <a href="/inscription">S'inscrire</a></p>
    </div>
</div>
<script>
document.getElementById("form-connexion").addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = document.getElementById("form-error");
    err.textContent = "";
    const res = await fetch("/api/auth/connexion", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({email: e.target.email.value, mot_de_passe: e.target.mot_de_passe.value}),
    });
    const data = await res.json();
    if (res.ok) {
        localStorage.setItem("token", data.token);
        localStorage.setItem("user", JSON.stringify(data.utilisateur));
        window.location.href = "/dashboard";
    } else {
        err.textContent = data.error || "Erreur de connexion";
    }
});
</script>
{% endblock %}
